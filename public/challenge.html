<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Accept Challenge</title><link rel="stylesheet" href="/styles.css"/></head>
<body><div class="topbar"><strong>Challenge</strong><nav class="nav-links" aria-label="Primary"><a data-nav="home" href="/home">Home</a><a data-nav="profile" id="myProfileLink" href="/">My Profile</a><a data-nav="leaderboard" href="/leaderboard">Leaderboard</a><a data-nav="daily" id="navDaily" href="/daily">Daily Challenge</a></nav><a id="navNewChallenge" href="/?new=1" class="small-link topbar-utility-link">New Challenge</a><span id="profileBar">Loading...</span></div><main class="arena-shell">
<div class="arena-particles" aria-hidden="true"></div>
<section class="card chaotic-arena-panel">
<h1 class="chaos-glow">Challenge Found</h1><p id="chalInfo"></p>
<div class="arena-faceoff">
  <article class="arena-player-card"><div id="playerAIdentity"></div><div id="playerARank" class="gas-rank-badge">Gas Trainee</div></article>
  <div class="arena-vs chaos-glow">⚡ VS ⚡</div>
  <article class="arena-player-card"><div id="playerBIdentity"></div><div id="playerBRank" class="gas-rank-badge">Gas Trainee</div></article>
</div>
</section>
<section class="card chaotic-arena-panel"><h2 class="chaos-glow">Choose Your Creature</h2><input id="b-class" type="hidden" value="goblin"/><div id="challengeCreatureGrid" class="creature-select-grid" role="list"></div><div style="margin-top:10px"><button id="acceptBtn">Accept & Continue</button></div><p id="error" class="error"></p></section>
</main>
<script type="module">
import { acceptChallenge, generateCreatureNickname, getChallenge, getGasRankTitle, getOrCreateGuestPlayer, getPendingCreatureSelection, getPlayerCreatureId, getPlayerCreatureNickname, getProfile, loadViewerProfileBar, parsePath, randomSeed, renderCreaturePickerGrid, renderPlayerIdentity, setPendingCreatureSelection, setPlayerCreatureId, setPlayerCreatureNickname, updateTopNav } from '/app.js';

const err = document.getElementById('error');
const token = parsePath()[1];
const playerId = await getOrCreateGuestPlayer();
const profile = await getProfile(playerId);
updateTopNav();
void loadViewerProfileBar({ profileBarEl: document.getElementById('profileBar'), playerId });

const classInput = document.getElementById('b-class');
const grid = document.getElementById('challengeCreatureGrid');
const pendingSelection = getPendingCreatureSelection();
let selectedCreatureId = getPlayerCreatureId(playerId) || pendingSelection?.creatureId || 'goblin';
let selectedNickname = getPlayerCreatureNickname(playerId) || pendingSelection?.nickname || generateCreatureNickname(selectedCreatureId);

function renderSelectedPreview() {
  classInput.value = selectedCreatureId;
  renderPlayerIdentity(document.getElementById('playerBIdentity'), {
    playerId,
    creatureId: selectedCreatureId,
    creatureNickname: selectedNickname,
    variant: 'default',
  });
}

function selectCreature(nextCreatureId) {
  const shouldKeepNickname = nextCreatureId === selectedCreatureId && selectedNickname;
  selectedCreatureId = nextCreatureId;
  if (!shouldKeepNickname) {
    selectedNickname = generateCreatureNickname(nextCreatureId);
  }
  setPendingCreatureSelection({ creatureId: selectedCreatureId, nickname: selectedNickname });
  setPlayerCreatureId(playerId, selectedCreatureId);
  setPlayerCreatureNickname(playerId, selectedNickname);
  renderCreaturePickerGrid({ container: grid, selectedId: selectedCreatureId, onSelect: selectCreature });
  renderSelectedPreview();
}

renderCreaturePickerGrid({ container: grid, selectedId: selectedCreatureId, onSelect: selectCreature });
renderSelectedPreview();

try {
  const c = await getChallenge(token, playerId);
  if (c.matchId && (c.playerAId === playerId || c.playerBId === playerId)) {
    const side = c.playerAId === playerId ? 'A' : 'B';
    location.replace(`/m/${c.matchId}?side=${side}`);
  } else {
    document.getElementById('chalInfo').textContent = `Opponent creature locked in (expires ${new Date(c.expiresAtISO).toLocaleString()}).`;
    if (c.playerAId) {
      const hostProfile = await getProfile(c.playerAId);
      const hostTitle = getGasRankTitle(hostProfile.profile.wins ?? 0);
      document.getElementById('playerARank').textContent = hostTitle;
      document.getElementById('playerARank').classList.toggle('top-tier', hostTitle.includes('👑'));
      const hostNickname = c.playerANickname || getPlayerCreatureNickname(c.playerAId);
      renderPlayerIdentity(document.getElementById('playerAIdentity'), {
        playerId: c.playerAId,
        creatureId: c.creatureA.classKey,
        creatureNickname: hostNickname,
        variant: 'default',
      });
    } else {
      renderPlayerIdentity(document.getElementById('playerAIdentity'), {
        playerId: 'Unknown',
        creatureId: c.creatureA.classKey,
        variant: 'default',
        showNickname: false,
      });
    }
    const guestTitle = getGasRankTitle(profile.profile.wins ?? 0);
    document.getElementById('playerBRank').textContent = guestTitle;
    document.getElementById('playerBRank').classList.toggle('top-tier', guestTitle.includes('👑'));
    if (c.status !== 'open') {
      document.getElementById('chalInfo').textContent = 'This challenge is no longer open for new players.';
      document.getElementById('acceptBtn').style.display = 'none';
    }
  }
} catch (e) {
  document.getElementById('chalInfo').innerHTML = `Could not load challenge. <a href='/?new=1'>Back to Home</a>`;
  err.textContent = e.message;
}

document.getElementById('acceptBtn').onclick = async () => {
  err.textContent = '';
  try {
    setPendingCreatureSelection({ creatureId: selectedCreatureId, nickname: selectedNickname });
    setPlayerCreatureId(playerId, selectedCreatureId);
    setPlayerCreatureNickname(playerId, selectedNickname);
    const r = await acceptChallenge(token, playerId, { classKey: selectedCreatureId, cosmeticSeed: randomSeed() }, getPlayerCreatureId(playerId));
    location.href = `/m/${r.matchId}?side=B`;
  } catch (e) { err.textContent = e.message; }
};
</script></body></html>
