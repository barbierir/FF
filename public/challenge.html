<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Accept Challenge</title><link rel="stylesheet" href="/styles.css"/></head>
<body><div class="topbar"><strong>Challenge</strong><span id="profileBar">Loading…</span></div><main>
<section class="card"><h1>Challenge Found</h1><p id="chalInfo"></p></section>
<section class="card"><h2>Your Creature</h2><div class="row"><div><label>classKey</label><select id="b-class"><option>goblin</option><option>dragon</option><option>skunk</option><option>troll</option><option>fairy</option></select></div><div><label>cosmeticSeed</label><input id="b-seed" type="number"/></div></div><div style="margin-top:10px"><button id="acceptBtn">Accept & Continue</button></div><p id="error" class="error"></p></section>
</main>
<script type="module">
import { acceptChallenge, getChallenge, getOrCreateGuestPlayer, getProfile, parsePath, randomSeed, setProfileBar, creatureFromDom } from '/app.js';
const err = document.getElementById('error');
document.getElementById('b-seed').value = String(randomSeed());
const token = parsePath()[1];
const playerId = await getOrCreateGuestPlayer();
const profile = await getProfile(playerId);
setProfileBar(document.getElementById('profileBar'), profile.profile);
try {
  const c = await getChallenge(token);
  document.getElementById('chalInfo').textContent = `Opponent picked ${c.creatureA.classKey} (expires ${new Date(c.expiresAtISO).toLocaleString()}).`;
  if (c.status !== 'open') {
    document.getElementById('chalInfo').textContent = 'This challenge is not open anymore. Start a new one!';
    document.getElementById('acceptBtn').style.display = 'none';
  }
} catch (e) {
  document.getElementById('chalInfo').innerHTML = `Could not load challenge. <a href='/'>Go home</a>`;
  err.textContent = e.message;
}
document.getElementById('acceptBtn').onclick = async () => {
  err.textContent = '';
  try {
    const r = await acceptChallenge(token, playerId, creatureFromDom('b'));
    location.href = `/m/${r.matchId}?side=B`;
  } catch (e) { err.textContent = e.message; }
};
</script></body></html>
