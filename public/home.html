<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Player Home</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="topbar">
    <strong>Player Home</strong>
    <nav class="nav-links">
      <a href="/home">Home</a>
      <a id="navNewChallenge" href="/?new=1">New Challenge</a>
      <a href="/leaderboard">Leaderboard</a>
      <a id="myProfileLink" href="/">My Profile</a>
      <a id="navDaily" href="/daily">Daily</a>
      <a id="navResumeReplay" href="/" hidden>Resume last replay</a>
    </nav>
    <span id="profileBar">Loading…</span>
  </div>
  <main>
    <section class="card">
      <h1>My Farting Champion</h1>
      <p id="homeNewModeNote" class="small" style="display:none">New Challenge mode is active.</p>
      <div id="homePlayerIdentity"></div>
      
    </section>

    <section class="card">
      <h2>Open challenges</h2>
      <p class="small">If your friend sent you a Rematch link, open it. Otherwise pick one below.</p>
      <ul id="openChallenges"></ul>
    </section>

    <section class="card">
      <h2>Recent matches</h2>
      <ul id="recent"></ul>
    </section>
  </main>
  <script type="module">
    import { fetchOpenChallenges, getOrCreateGuestPlayer, getPlayerCreatureId, getPlayerCreatureNickname, loadViewerProfileBar, renderPlayerIdentity, shouldSkipAutoResume, updateTopNav } from '/app.js';

    if (shouldSkipAutoResume()) {
      const note = document.getElementById('homeNewModeNote');
      if (note) note.style.display = 'block';
    }

    try {
      const playerId = await getOrCreateGuestPlayer();
      updateTopNav();
      void loadViewerProfileBar({ profileBarEl: document.getElementById('profileBar'), playerId });
      renderPlayerIdentity(document.getElementById('homePlayerIdentity'), {
        playerId,
        creatureId: getPlayerCreatureId(playerId),
        creatureNickname: getPlayerCreatureNickname(playerId),
        variant: 'default',
      });

      const publicData = await fetch(`/api/players/${encodeURIComponent(playerId)}/public`).then((r) => r.json());
      const recent = document.getElementById('recent');
      if (!publicData.recentMatches?.length) {
        recent.innerHTML = '<li>No finished matches yet.</li>';
      } else {
        recent.innerHTML = publicData.recentMatches
          .map((m) => {
            const opponentLabel = m.opponentCreatureNickname || (m.opponentCreatureId ? m.opponentCreatureId[0].toUpperCase() + m.opponentCreatureId.slice(1) : 'Unknown Creature');
            const result = m.resultLabel || 'Draw';
            return `<li><a href="/replay/${m.publicId}">${opponentLabel}</a> · ${result} · MaxHit ${m.maxHit}</li>`;
          })
          .join('');
      }

      const openChallenges = document.getElementById('openChallenges');
      const inbox = await fetchOpenChallenges(playerId);
      if (!inbox.items?.length) {
        openChallenges.innerHTML = '<li>No open challenges right now.</li>';
      } else {
        openChallenges.innerHTML = inbox.items
          .map((item) => `<li><span class="challenge-row-identity" data-player-id="${item.playerAId ?? 'unknown'}" data-creature-id="${item.creatureA.classKey}"></span> · <a class="button-link" href="/c/${item.token}">Accept</a></li>`)
          .join('');
        openChallenges.querySelectorAll('.challenge-row-identity').forEach((el) => {
          const id = el.getAttribute('data-player-id') || 'unknown';
          const creatureId = el.getAttribute('data-creature-id');
          renderPlayerIdentity(el, {
            playerId: id,
            creatureId,
            creatureNickname: id !== 'unknown' ? getPlayerCreatureNickname(id) : null,
            variant: 'compact',
          });
        });
      }
    } catch (error) {
      const message = error instanceof Error ? error.message : String(error);
      const profileBar = document.getElementById('profileBar');
      if (profileBar) profileBar.textContent = 'Could not load page.';
      const openChallenges = document.getElementById('openChallenges');
      if (openChallenges) {
        openChallenges.innerHTML = `<li class="error">Could not load open challenges: ${message}</li>`;
      }
    }
  </script>
</body>
</html>
