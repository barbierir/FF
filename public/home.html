<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Home</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="topbar">
    <strong>Home</strong>
    <nav class="nav-links" aria-label="Primary"><a data-nav="home" href="/home">Home</a><a data-nav="profile" id="myProfileLink" href="/">My Profile</a><a data-nav="leaderboard" href="/leaderboard">Leaderboard</a><a data-nav="daily" id="navDaily" href="/daily">Daily Challenge</a></nav><a id="navNewChallenge" href="/?new=1" class="small-link topbar-utility-link">New Challenge</a>
    <span id="profileBar">Loading...</span>
  </div>
  <main class="page-stack">
    <section class="card module-primary">
      <h1>My Farting Champion</h1>
      <p id="homeNewModeNote" class="small" style="display:none">New Challenge mode is active.</p>
      <div id="homePlayerIdentity"></div>
      <section id="homeShareActions" class="challenge-share" hidden></section>
      <p id="homeShareFeedback" class="small"></p>
    </section>

    <section class="card module-secondary">
      <h2>Open Challenges</h2>
      <p class="small">If your friend sent you a Rematch link, open it. Otherwise pick one below.</p>
      <ul id="openChallenges" class="data-list"></ul>
    </section>

    <section class="card module-secondary">
      <h2>Recent Matches</h2>
      <ul id="recent" class="data-list"></ul>
    </section>
  </main>
  <script type="module">
    import { buildChallengeShareText, createStatusBadge, fetchOpenChallenges, getOrCreateGuestPlayer, getPlayerCreatureId, getPlayerCreatureNickname, getShareableChallengeUrl, listMyChallenges, loadViewerProfileBar, outcomeToBadgeVariant, renderChallengeShareActions, renderPlayerIdentity, shouldSkipAutoResume, updateTopNav } from '/app.js';

    console.info('[home] HOME_MOUNTED');

    if (shouldSkipAutoResume()) {
      const note = document.getElementById('homeNewModeNote');
      if (note) note.style.display = 'block';
    }

    const openChallenges = document.getElementById('openChallenges');
    const recent = document.getElementById('recent');

    try {
      console.info('[home] PLAYER_ID_START');
      const playerId = await getOrCreateGuestPlayer();
      console.info('[home] PLAYER_ID_DONE', { playerId });

      updateTopNav();
      console.info('[home] AUDIO_INIT_START');
      void loadViewerProfileBar({ profileBarEl: document.getElementById('profileBar'), playerId })
        .then(() => {
          console.info('[home] AUDIO_INIT_DONE');
        })
        .catch((error) => {
          console.error('[home] AUDIO_INIT_ERROR', error);
        });

      renderPlayerIdentity(document.getElementById('homePlayerIdentity'), {
        playerId,
        creatureId: getPlayerCreatureId(playerId),
        creatureNickname: getPlayerCreatureNickname(playerId),
        variant: 'default',
      });
      console.info('[home] HOME_READY_SET_TRUE');

      const toResultBadge = (label) => createStatusBadge({ label, variant: outcomeToBadgeVariant(label), size: 'sm' }).outerHTML;

      const loadShareActions = async () => {
        console.info('[home] MATCH_PRELOAD_START');
        try {
          const myOpen = await listMyChallenges(playerId, 'open', 20);
          const outgoing = (myOpen.items || []).find((item) => item.playerAId === playerId);
          renderChallengeShareActions(document.getElementById('homeShareActions'), {
            url: getShareableChallengeUrl(outgoing),
            message: outgoing ? buildChallengeShareText({
              challengerLabel: getPlayerCreatureNickname(playerId) || 'A Challenger',
            }) : null,
            onCopyStateChange: (message, isError) => {
              const feedback = document.getElementById('homeShareFeedback');
              feedback.textContent = message;
              feedback.className = isError ? 'error' : 'small';
            },
          });
          console.info('[home] MATCH_PRELOAD_DONE');
        } catch (error) {
          console.error('[home] MATCH_PRELOAD_ERROR', error);
        }
      };

      const loadRecentMatches = async () => {
        console.info('[home] PLAYER_FETCH_START');
        try {
          const publicData = await fetch(`/api/players/${encodeURIComponent(playerId)}/public`).then((r) => r.json());
          if (!publicData.recentMatches?.length) {
            recent.innerHTML = '<li>No finished matches yet.</li>';
          } else {
            recent.innerHTML = publicData.recentMatches
              .map((m) => {
                const opponentLabel = m.opponentCreatureNickname || (m.opponentCreatureId ? m.opponentCreatureId[0].toUpperCase() + m.opponentCreatureId.slice(1) : 'Unknown Creature');
                const result = m.resultLabel || 'Draw';
                return `<li><a href="/replay/${m.publicId}">${opponentLabel}</a> · ${toResultBadge(result)} · MaxHit ${m.maxHit}</li>`;
              })
              .join('');
          }
          console.info('[home] PLAYER_FETCH_DONE');
        } catch (error) {
          console.error('[home] PLAYER_FETCH_ERROR', error);
          recent.innerHTML = '<li class="error">Could not load recent matches.</li>';
        }
      };

      const loadOpenChallenges = async () => {
        try {
          const inbox = await fetchOpenChallenges(playerId);
          if (!inbox.items?.length) {
            openChallenges.innerHTML = '<li>No open challenges right now.</li>';
            return;
          }

          openChallenges.innerHTML = inbox.items
            .map((item) => `<li><span class="challenge-row-identity" data-player-id="${item.playerAId ?? 'unknown'}" data-creature-id="${item.creatureA.classKey}"></span> · <a class="button-link" href="/c/${item.token}">Accept Challenge</a></li>`)
            .join('');
          openChallenges.querySelectorAll('.challenge-row-identity').forEach((el) => {
            const id = el.getAttribute('data-player-id') || 'unknown';
            const creatureId = el.getAttribute('data-creature-id');
            renderPlayerIdentity(el, {
              playerId: id,
              creatureId,
              creatureNickname: null,
              variant: 'compact',
            });
          });
        } catch (error) {
          console.error('[home] HOME_INIT_ERROR openChallenges', error);
          openChallenges.innerHTML = '<li class="error">Could not load open challenges.</li>';
        }
      };

      await Promise.allSettled([loadShareActions(), loadRecentMatches(), loadOpenChallenges()]);
    } catch (error) {
      console.error('[home] HOME_INIT_ERROR', error);
      const message = error instanceof Error ? error.message : String(error);
      const profileBar = document.getElementById('profileBar');
      if (profileBar) profileBar.textContent = 'Could not load page.';
      if (openChallenges) {
        openChallenges.innerHTML = `<li class="error">Could not load open challenges: ${message}</li>`;
      }
      if (recent) {
        recent.innerHTML = `<li class="error">Could not load recent matches: ${message}</li>`;
      }
    }
  </script>
</body>
</html>
