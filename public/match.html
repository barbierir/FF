<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Match</title><link rel="stylesheet" href="/styles.css"/></head>
<body><div class="topbar"><strong>Match</strong><nav class="nav-links" aria-label="Primary"><a data-nav="home" href="/home">Home</a><a data-nav="profile" id="myProfileLink" href="/">My Profile</a><a data-nav="leaderboard" href="/leaderboard">Leaderboard</a><a data-nav="daily" id="navDaily" href="/daily">Daily Challenge</a></nav><a id="navNewChallenge" href="/?new=1" class="small-link topbar-utility-link">New Challenge</a><span id="meta"></span></div><main class="arena-shell page-stack">
<section class="card module-primary"><h2 id="modeLabel">Mode</h2><p id="statusMsg">Loading…</p><div id="actions"></div><p id="error" class="error"></p></section>
<section class="card module-secondary" id="finishedPanel" style="display:none"><h2>Match Finished</h2><p><a class="button-link" id="viewReplayLink" href="#">View Replay</a></p></section>
</main>
<script type="module">
import { getMatch, getOrCreateGuestPlayer, parsePath, submitAction, updateTopNav } from '/app.js';
const matchId = parsePath()[1];
const playerId = await getOrCreateGuestPlayer();
updateTopNav();
const actionsWrap = document.getElementById('actions');
const statusMsg = document.getElementById('statusMsg');
const errorEl = document.getElementById('error');
const actionDefs = [
  { label: 'ATTACK 1', value: { type: 'ATTACK', gas: 1 } },
  { label: 'ATTACK 2', value: { type: 'ATTACK', gas: 2 } },
  { label: 'ATTACK 3', value: { type: 'ATTACK', gas: 3 } },
  { label: 'ATTACK 4', value: { type: 'ATTACK', gas: 4 } },
  { label: 'DEFEND', value: { type: 'DEFEND' } },
  { label: 'RECHARGE', value: { type: 'RECHARGE_EXTRA' } },
  { label: 'HEAL', value: { type: 'HEAL' } },
];
let selected = null;

function renderActions(disabled) {
  actionsWrap.replaceChildren();
  for (const def of actionDefs) {
    const b = document.createElement('button');
    b.textContent = def.label;
    b.disabled = disabled;
    b.className = selected === def.label ? 'secondary' : '';
    b.onclick = async () => {
      selected = def.label;
      renderActions(true);
      statusMsg.textContent = 'Action locked · Waiting for opponent';
      errorEl.textContent = '';
      try {
        const result = await submitAction(matchId, def.value, playerId);
        if (result.status === 'finished') {
          const latest = await getMatch(matchId);
          if (latest.publicId) location.href = `/replay/${latest.publicId}`;
          return;
        }
      } catch (e) {
        errorEl.textContent = e instanceof Error ? e.message : String(e);
      }
    };
    actionsWrap.appendChild(b);
  }
}

async function refresh() {
  const m = await getMatch(matchId);
  const mode = m.mode || 'auto';
  document.getElementById('modeLabel').textContent = `Mode: ${mode === 'manual' ? 'Manuale' : 'Auto'}`;
  if (mode === 'auto' && m.publicId) {
    location.replace(`/replay/${m.publicId}`);
    return;
  }

  if (m.status === 'finished') {
    statusMsg.textContent = 'Match finished';
    document.getElementById('finishedPanel').style.display = 'block';
    document.getElementById('viewReplayLink').href = m.publicId ? `/replay/${m.publicId}` : '/home';
    actionsWrap.replaceChildren();
    return;
  }

  const side = m.playerAId === playerId ? 'A' : m.playerBId === playerId ? 'B' : null;
  if (mode === 'auto') {
    statusMsg.textContent = 'Auto battle in progress';
    actionsWrap.replaceChildren();
    return;
  }

  if (!side) {
    statusMsg.textContent = 'You are not a participant';
    renderActions(true);
    return;
  }

  const locked = Boolean(m.pendingActions?.[side]);
  if (locked) {
    statusMsg.textContent = 'Action locked · Waiting for opponent';
    renderActions(true);
  } else {
    statusMsg.textContent = 'Choose your action';
    renderActions(false);
  }
}

await refresh();
setInterval(refresh, 1500);
</script></body></html>
