<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Replay</title><link rel="stylesheet" href="/styles.css"/></head>
<body><div class="topbar"><strong>Replay</strong><nav class="nav-links" aria-label="Primary"><a data-nav="home" href="/home">Home</a><a data-nav="profile" id="myProfileLink" href="/">My Profile</a><a data-nav="leaderboard" href="/leaderboard">Leaderboard</a><a data-nav="daily" id="navDaily" href="/daily">Daily</a></nav><a id="navNewChallenge" href="/?new=1" class="small-link topbar-utility-link">New Challenge</a><span id="profileBar">Loading…</span></div><main>
<section class="card"><h1 id="title">Battle Replay</h1><p id="winner" class="victory-highlight"></p><p id="stats"></p><div class="replay-creature-row"><div id="replayIdentityA"></div><div class="arena-vs">VS</div><div id="replayIdentityB"></div></div><div class="button-row primary-cta-group"><a class="button-link primary-cta" href="/?new=1">New Challenge</a><button class="primary-cta" id="rematchBtn" disabled>Rematch me, coward</button></div><p class="small">Rematch creates a new challenge link. Send it to your opponent; they must accept it.</p><p><a id="sharePage" href="#">Share Page</a></p><button class="secondary" id="copyShareText">Copy Share Text</button> <button id="shareBtn">I shared this</button><p id="shareMsg"></p><div id="rematchResult"></div></section>
<section class="card"><h2>HP</h2><div>A <div class="hp"><span id="hpA"></span></div></div><div>B <div class="hp"><span id="hpB"></span></div></div><button class="secondary" id="skip">Skip</button> <button class="secondary" id="replay">Replay</button><div class="log" id="log"></div></section>
</main>
<div id="sideModal" class="modal" hidden><div class="modal-content"><h3>Pick your side</h3><p class="small">We couldn't map your player ID to this replay. Pick the side you played.</p><div class="button-row"><button id="sideA">I was A (left)</button><button id="sideB">I was B (right)</button></div><button class="secondary" id="cancelSidePicker">Cancel</button></div></div>
<script type="module">
import { copyText, createRematch, fetchReplay, getViewerPlayerId, loadViewerProfileBar, parsePath, rememberLastReplayPublicId, renderPlayerIdentity, shareReplay, updateTopNav } from '/app.js';

const publicId = parsePath()[1];
const sideStorageKey = `faf_rematch_side_${publicId}`;
const rematchBtn = document.getElementById('rematchBtn');
const sideModal = document.getElementById('sideModal');
const rematchResult = document.getElementById('rematchResult');
const shareMsg = document.getElementById('shareMsg');
const sideAButton = document.getElementById('sideA');
const sideBButton = document.getElementById('sideB');
const cancelSidePickerButton = document.getElementById('cancelSidePicker');
let data = null;
let viewerPlayerId = null;
let pickedSide = null;
let rematchInFlight = false;


function getDetectedSide() {
  if (!data) return null;
  if (data.match?.playerAId === viewerPlayerId) return 'A';
  if (data.match?.playerBId === viewerPlayerId) return 'B';
  return null;
}

function getPickedSide() {
  const stored = sessionStorage.getItem(sideStorageKey);
  if (stored === 'A' || stored === 'B') return stored;
  return pickedSide;
}

function getResolvedSide() {
  return getDetectedSide() ?? getPickedSide();
}

function showSidePicker() { sideModal.hidden = false; }
function hideSidePicker() { sideModal.hidden = true; }


function renderRematchResult(payload) {
  const absUrl = `${location.origin}${payload.url}`;
  rematchResult.innerHTML = `
    <div class="card invite-panel">
      <h3>Rematch created!</h3>
      <p>Accept link: <a href="${payload.url}">${absUrl}</a></p>
      <div class="button-row">
        <button class="secondary" id="copyRematchLink">Copy Link</button>
        <button class="secondary" id="copyRematchText">Copy Meme Text</button>
        <a class="button-link" id="openAcceptPage" href="${payload.url}">Open Accept Page</a>
        <a class="button-link" href="/?new=1">New Challenge</a>
      </div>
    </div>
  `;
  document.getElementById('copyRematchLink').onclick = () => copyText(absUrl);
  document.getElementById('copyRematchText').onclick = () => copyText(payload.suggestedText);
}

async function requestRematch() {
  if (rematchInFlight) return;
  const resolvedSide = getResolvedSide();
  if (!resolvedSide) {
    showSidePicker();
    return;
  }

  rematchInFlight = true;
  rematchBtn.disabled = true;
  try {
    const payload = await createRematch(publicId, viewerPlayerId, resolvedSide);
    renderRematchResult(payload);
  } catch (error) {
    rematchResult.textContent = error.message;
  } finally {
    rematchInFlight = false;
    rematchBtn.disabled = false;
  }
}

function pickSide(side) {
  pickedSide = side;
  sessionStorage.setItem(sideStorageKey, side);
  hideSidePicker();
}

if (!sideAButton || !sideBButton || !cancelSidePickerButton) {
  throw new Error('side picker buttons missing from DOM');
}

sideAButton.addEventListener('click', () => pickSide('A'));
sideBButton.addEventListener('click', () => pickSide('B'));
cancelSidePickerButton.addEventListener('click', () => {
  hideSidePicker();
});

rematchBtn.onclick = requestRematch;

try {
  data = await fetchReplay(publicId);
  rememberLastReplayPublicId(publicId);
  viewerPlayerId = await getViewerPlayerId();
  const storedSide = sessionStorage.getItem(sideStorageKey);
  if (storedSide === 'A' || storedSide === 'B') pickedSide = storedSide;
  updateTopNav();
  void loadViewerProfileBar({ profileBarEl: document.getElementById('profileBar'), playerId: viewerPlayerId });
  document.getElementById('winner').textContent = `Winner: ${data.summary.winner}`;
  document.getElementById('stats').textContent = `Turns ${data.summary.turns} · MaxHit ${data.summary.highlights.maxHitValue} · Cataclysms ${data.summary.highlights.cataclysms.A + data.summary.highlights.cataclysms.B} · Backfires ${data.summary.a.backfires + data.summary.b.backfires}`;
  renderPlayerIdentity(document.getElementById('replayIdentityA'), {
    playerId: data.match?.playerAId ?? 'Player A',
    creatureId: data.summary.a.classKey,
    creatureNickname: data.match?.playerAId ? localStorage.getItem(`ff:player:${data.match.playerAId}:creatureNickname`) : null,
    variant: 'default',
  });
  renderPlayerIdentity(document.getElementById('replayIdentityB'), {
    playerId: data.match?.playerBId ?? 'Player B',
    creatureId: data.summary.b.classKey,
    creatureNickname: data.match?.playerBId ? localStorage.getItem(`ff:player:${data.match.playerBId}:creatureNickname`) : null,
    variant: 'default',
  });
  if (window.location.hostname === 'localhost') {
    console.debug('Replay match hash', data.matchHash);
  }
  document.getElementById('sharePage').href = `/r/${publicId}`;
  rematchBtn.disabled = false;
} catch (error) {
  shareMsg.textContent = error.message;
}

document.getElementById('copyShareText').onclick = async () => {
  try {
    const shareText = await fetch(`/api/replay/${encodeURIComponent(publicId)}/share-text`).then((r) => r.json());
    await copyText(shareText.text);
    shareMsg.textContent = 'Share text copied!';
  } catch {
    shareMsg.textContent = 'Could not generate share text';
  }
};
document.getElementById('shareBtn').onclick = async ()=>{
  try {
    const r = await shareReplay(publicId, viewerPlayerId);
    shareMsg.textContent = r.awarded ? `Shared! +${r.stinkFameGained ?? 0} SF` : "Shared! (daily cap reached)";
  } catch(e) {
    shareMsg.textContent = e.message;
  }
};

const icon = (ev)=>{
  if(ev.kind==='DEFEND') return '🛡️'; if(ev.kind==='HEAL') return '🧚✨'; if(ev.kind==='DOT') return '🔥';
  if(ev.kind==='ATTACK' && ev.outcome==='BACKFIRE') return '💥↩️';
  if(ev.kind==='ATTACK' && ev.outcome==='TOXIC') return '☠️💨';
  if(ev.kind==='ATTACK' && ev.outcome==='CATACLYSM') return '🌪️💨🔥';
  if(ev.kind==='ATTACK') return '💨';
  return '➖';
};

const hpA=document.getElementById('hpA'); const hpB=document.getElementById('hpB'); const log=document.getElementById('log');
let i=0, timer;
function renderEvent(ev){
  hpA.style.width = `${Math.max(0, Math.min(100, (ev.prA/20)*100))}%`;
  hpB.style.width = `${Math.max(0, Math.min(100, (ev.prB/20)*100))}%`;
  const line=document.createElement('div');
  line.textContent=`T${ev.t} ${ev.actor} ${icon(ev)} ${ev.kind}${ev.outcome?` ${ev.outcome}`:''} | HP A:${ev.prA} B:${ev.prB}`;
  log.appendChild(line); log.scrollTop = log.scrollHeight;
}
function play(){ if(!data) return; clearInterval(timer); log.innerHTML=''; i=0; timer=setInterval(()=>{ if(i>=data.events.length){ clearInterval(timer); return; } renderEvent(data.events[i++]); },250); }
function skip(){ if(!data) return; clearInterval(timer); for(;i<data.events.length;i++) renderEvent(data.events[i]); }

document.getElementById('skip').onclick = skip;
document.getElementById('replay').onclick = play;
play();
</script></body></html>
