<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Fart And Furious</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="topbar">
    <strong>Fart And Furious</strong>
    <nav class="nav-links" aria-label="Primary"><a data-nav="home" href="/home">Home</a><a data-nav="profile" id="myProfileLink" href="/">My Profile</a><a data-nav="leaderboard" href="/leaderboard">Leaderboard</a><a data-nav="daily" id="navDaily" href="/daily">Daily Challenge</a></nav><a id="navNewChallenge" href="/?new=1" class="small-link topbar-utility-link">New Challenge</a>
    <span id="profileBar">Loading...</span>
  </div>
  <main class="page-stack">
    <section class="card module-secondary">
      <h1>Fart And Furious</h1>
      <p>Create a challenge link and send it to a friend.</p>
      <p id="newModeNote" class="small" style="display:none">New Challenge mode: cleared previous replay state.</p>
          </section>

    <section class="card module-primary">
      <h2>Choose Your Creature</h2>
      <input id="a-class" type="hidden" value="goblin" aria-label="Selected creature"/>
      <div id="creatureGrid" class="creature-select-grid" role="list"></div>
      <div id="selectedIdentity"></div>
      <fieldset class="mode-picker"><legend>Match mode</legend><label><input type="radio" name="matchMode" value="manual"/> Manuale</label><label><input type="radio" name="matchMode" value="auto" checked/> Auto</label></fieldset>
      <div class="card-actions"><button id="createBtn">New Challenge</button></div>
      <p id="error" class="error"></p>
      <section id="linkWrap" class="challenge-share" hidden></section>
      <p id="shareFeedback" class="small"></p>
      <div id="continueWrap" class="card-actions" style="display:none"><h3>Continue</h3><p id="continueMsg" class="small"></p></div>
    </section>

      </main>
<script type="module">
console.info('[home] HOME_SCRIPT_LOADED');

let app;
try {
  app = await import('/app.js');
} catch (error) {
  console.error('[home] MODULE_IMPORT_ERROR', error);
  const err = document.getElementById('error');
  if (err) err.textContent = `Could not load page: ${error instanceof Error ? error.message : String(error)}`;
  const profileBar = document.getElementById('profileBar');
  if (profileBar) profileBar.textContent = 'Could not load page.';
  throw error;
}

const { buildChallengeShareText, createChallenge, creatureFromDom, flushPendingCreatureIdToPlayer, generateCreatureNickname, getChallenge, getOrCreateGuestPlayer, getPendingCreatureSelection, getPlayerCreatureId, getPlayerCreatureNickname, getShareableChallengeUrl, loadViewerProfileBar, renderChallengeShareActions, renderCreaturePickerGrid, renderPlayerIdentity, setPendingCreatureSelection, setPlayerCreatureId, setPlayerCreatureNickname, shouldSkipAutoResume, updateTopNav } = app;

const err = document.getElementById('error');
const matchModeInput = () => document.querySelector('input[name="matchMode"]:checked')?.value || "auto";
console.info('[home] APP_BOOTSTRAP_START');
try {
const forceNewMode = shouldSkipAutoResume();
if (forceNewMode) {
  const note = document.getElementById('newModeNote');
  if (note) note.style.display = 'block';
  history.replaceState({}, '', '/');
}
const playerId = await getOrCreateGuestPlayer();
updateTopNav();
console.info('[home] PROFILE_INIT_START');
void loadViewerProfileBar({
  profileBarEl: document.getElementById('profileBar'),
  playerId,
}).then(() => {
  console.info('[home] PROFILE_INIT_DONE');
}).catch((error) => {
  console.error('[home] PROFILE_INIT_ERROR', error);
});
let continuePoll = null;

flushPendingCreatureIdToPlayer(playerId);

const classInput = document.getElementById('a-class');
const grid = document.getElementById('creatureGrid');
const selectedIdentity = document.getElementById('selectedIdentity');
const pendingSelection = getPendingCreatureSelection();
let selectedCreatureId = getPlayerCreatureId(playerId) || pendingSelection?.creatureId || 'goblin';
let selectedNickname = getPlayerCreatureNickname(playerId) || pendingSelection?.nickname || generateCreatureNickname(selectedCreatureId);

classInput.value = selectedCreatureId;
setPendingCreatureSelection({ creatureId: selectedCreatureId, nickname: selectedNickname });
setPlayerCreatureId(playerId, selectedCreatureId);
setPlayerCreatureNickname(playerId, selectedNickname);

function renderNicknameLine() {
  renderPlayerIdentity(selectedIdentity, {
    playerId,
    creatureId: selectedCreatureId,
    creatureNickname: selectedNickname,
    variant: 'default',
  });
}

function selectCreature(nextCreatureId) {
  const shouldKeepNickname = nextCreatureId === selectedCreatureId && selectedNickname;
  selectedCreatureId = nextCreatureId;
  if (!shouldKeepNickname) {
    selectedNickname = generateCreatureNickname(nextCreatureId);
  }

  classInput.value = selectedCreatureId;
  setPendingCreatureSelection({ creatureId: selectedCreatureId, nickname: selectedNickname });
  setPlayerCreatureId(playerId, selectedCreatureId);
  setPlayerCreatureNickname(playerId, selectedNickname);

  renderCreaturePickerGrid({
    container: grid,
    selectedId: selectedCreatureId,
    onSelect: selectCreature,
  });
  renderNicknameLine();
}

console.info('[home] CREATURES_INIT_START');
renderCreaturePickerGrid({
  container: grid,
  selectedId: selectedCreatureId,
  onSelect: selectCreature,
});
renderNicknameLine();
console.info('[home] CREATURES_INIT_DONE');

async function checkAndContinue(token) {
  const status = await getChallenge(token);
  if (status.status === 'accepted' && status.matchId) {
    location.href = `/m/${status.matchId}?side=A`;
    return true;
  }
  return false;
}

function startContinuePolling(token) {
  document.getElementById('continueWrap').style.display = 'block';
  document.getElementById('continueMsg').textContent = 'Waiting for opponent…';
  if (continuePoll) clearInterval(continuePoll);
  continuePoll = setInterval(async () => {
    try {
      await checkAndContinue(token);
    } catch (e) {
      document.getElementById('continueMsg').textContent = `Waiting for opponent… (${e.message})`;
    }
  }, 2000);
}

console.info('[home] CREATE_MATCH_BIND_START');
try {
  document.getElementById('createBtn').onclick = async () => {
    err.textContent = '';
    try {
      const challenge = await createChallenge(playerId, creatureFromDom('a'), getPlayerCreatureId(playerId), matchModeInput());
      const url = `${location.origin}/c/${challenge.token}`;
      localStorage.setItem('lastChallengeToken', challenge.token);
  const shareWrap = document.getElementById('linkWrap');
      const shareFeedback = document.getElementById('shareFeedback');
      renderChallengeShareActions(shareWrap, {
        url: getShareableChallengeUrl(challenge) || url,
        message: buildChallengeShareText({ challengerLabel: selectedNickname }),
        onCopyStateChange: (message, isError) => {
          shareFeedback.textContent = message;
          shareFeedback.className = isError ? 'error' : 'small';
        },
      });
      const alreadyAccepted = await checkAndContinue(challenge.token);
      if (!alreadyAccepted) startContinuePolling(challenge.token);
    } catch (e) { err.textContent = e.message; }
  };
  console.info('[home] CREATE_MATCH_BIND_DONE');
} catch (error) {
  console.error('[home] CREATE_MATCH_BIND_ERROR', error);
  throw error;
}
const lastChallengeToken = forceNewMode ? null : localStorage.getItem('lastChallengeToken');
if (lastChallengeToken) {
  const url = `${location.origin}/c/${lastChallengeToken}`;
  const shareWrap = document.getElementById('linkWrap');
  const shareFeedback = document.getElementById('shareFeedback');
  renderChallengeShareActions(shareWrap, {
    url,
    message: buildChallengeShareText({ challengerLabel: selectedNickname }),
    onCopyStateChange: (message, isError) => {
      shareFeedback.textContent = message;
      shareFeedback.className = isError ? 'error' : 'small';
    },
  });
  try {
    const alreadyAccepted = await checkAndContinue(lastChallengeToken);
    if (!alreadyAccepted) startContinuePolling(lastChallengeToken);
  } catch {
    localStorage.removeItem('lastChallengeToken');
  }
}
console.info('[home] APP_BOOTSTRAP_DONE');
console.info('[home] HOME_INTERACTIVE_READY');
} catch (error) {
  console.error('[home] HOME_FATAL_ERROR', error);
  const message = error instanceof Error ? error.message : String(error);
  err.textContent = `Could not load page: ${message}`;
  const profileBar = document.getElementById('profileBar');
  if (profileBar) profileBar.textContent = 'Could not load page.';
}
</script></body></html>
