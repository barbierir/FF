<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Fart And Furious</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="topbar">
    <strong>Fart And Furious</strong>
    <nav class="nav-links">
      <a href="/home">Home</a>
      <a id="navNewChallenge" href="/?new=1">New Challenge</a>
      <a href="/leaderboard">Leaderboard</a>
      <a id="myProfileLink" href="/">My Profile</a>
      <a id="navResumeReplay" href="/" hidden>Resume last replay</a>
    </nav>
    <span id="profileBar">Loading profile…</span>
  </div>
  <main>
    <section class="card">
      <h1>Fart And Furious</h1>
      <p>Create a challenge link and send it to a friend.</p>
      <p id="newModeNote" class="small" style="display:none">New Challenge mode: cleared previous replay state.</p>
          </section>

    <section class="card">
      <h2>Choose your creature</h2>
      <input id="a-class" type="hidden" value="goblin" aria-label="Selected creature"/>
      <div id="creatureGrid" class="creature-select-grid" role="list"></div>
      <div style="margin-top:10px"><button id="createBtn">Create Challenge</button></div>
      <p id="error" class="error"></p>
      <div id="linkWrap" style="display:none">
        <label>Share link</label>
        <div class="linkbox"><input id="link" readonly/><button class="secondary" id="copyBtn">Copy</button></div>
      </div>
      <div id="continueWrap" style="display:none;margin-top:12px"><h3>Continue</h3><p id="continueMsg" class="small"></p></div>
    </section>

      </main>
<script type="module">
import { CREATURES, copyText, createChallenge, creatureFromDom, flushPendingCreatureIdToPlayer, getChallenge, getOrCreateGuestPlayer, getPendingCreatureId, getPlayerCreatureId, loadViewerProfileBar, setPendingCreatureId, setPlayerCreatureId, shouldSkipAutoResume, updateTopNav } from '/app.js';
const err = document.getElementById('error');
const forceNewMode = shouldSkipAutoResume();
if (forceNewMode) {
  const note = document.getElementById('newModeNote');
  if (note) note.style.display = 'block';
  history.replaceState({}, '', '/');
}
const playerId = await getOrCreateGuestPlayer();
updateTopNav();
void loadViewerProfileBar({
  profileBarEl: document.getElementById('profileBar'),
  playerId,
});
let continuePoll = null;

flushPendingCreatureIdToPlayer(playerId);

const classInput = document.getElementById('a-class');
const grid = document.getElementById('creatureGrid');
const savedCreatureId = getPlayerCreatureId(playerId) || getPendingCreatureId() || 'goblin';
classInput.value = savedCreatureId;

for (const creature of CREATURES) {
  const tile = document.createElement('article');
  tile.className = `creature-select-tile${savedCreatureId === creature.id ? ' selected' : ''}`;
  tile.setAttribute('role', 'button');
  tile.setAttribute('tabindex', '0');
  tile.setAttribute('aria-label', `Select ${creature.name}`);

  const imageWrap = document.createElement('div');
  imageWrap.className = 'creature-select-image';
  const img = document.createElement('img');
  img.src = creature.idleSrc;
  img.alt = `${creature.name} idle`;
  img.loading = 'lazy';
  imageWrap.appendChild(img);

  const name = document.createElement('h3');
  name.textContent = creature.name;

  const overlay = document.createElement('div');
  overlay.className = 'creature-select-overlay';
  overlay.innerHTML = `<strong>Special: ${creature.specialAbilityName}</strong><p>${creature.specialAbilityDescription}</p>`;

  const badge = document.createElement('span');
  badge.className = 'selected-badge';
  badge.textContent = 'Selected';
  if (savedCreatureId !== creature.id) badge.hidden = true;

  const selectCreature = () => {
    classInput.value = creature.id;
    setPendingCreatureId(creature.id);
    setPlayerCreatureId(playerId, creature.id);
    for (const node of grid.querySelectorAll('.creature-select-tile')) {
      const selected = node === tile;
      node.classList.toggle('selected', selected);
      const nodeBadge = node.querySelector('.selected-badge');
      if (nodeBadge) nodeBadge.hidden = !selected;
    }
  };

  tile.onclick = selectCreature;
  tile.onkeydown = (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      selectCreature();
    }
  };

  tile.append(imageWrap, name, overlay, badge);
  grid.appendChild(tile);
}

async function checkAndContinue(token) {
  const status = await getChallenge(token);
  if (status.status === 'accepted' && status.matchId) {
    location.href = `/m/${status.matchId}?side=A`;
    return true;
  }
  return false;
}

function startContinuePolling(token) {
  document.getElementById('continueWrap').style.display = 'block';
  document.getElementById('continueMsg').textContent = 'Waiting for opponent…';
  if (continuePoll) clearInterval(continuePoll);
  continuePoll = setInterval(async () => {
    try {
      await checkAndContinue(token);
    } catch (e) {
      document.getElementById('continueMsg').textContent = `Waiting for opponent… (${e.message})`;
    }
  }, 2000);
}

document.getElementById('createBtn').onclick = async () => {
  err.textContent = '';
  try {
    const challenge = await createChallenge(playerId, creatureFromDom('a'), getPlayerCreatureId(playerId));
    const url = `${location.origin}/c/${challenge.token}`;
    localStorage.setItem('lastChallengeToken', challenge.token);
    document.getElementById('link').value = url;
    document.getElementById('linkWrap').style.display = 'block';
    const alreadyAccepted = await checkAndContinue(challenge.token);
    if (!alreadyAccepted) startContinuePolling(challenge.token);
  } catch (e) { err.textContent = e.message; }
};
document.getElementById('copyBtn').onclick = async () => {
  await copyText(document.getElementById('link').value);
};

const lastChallengeToken = forceNewMode ? null : localStorage.getItem('lastChallengeToken');
if (lastChallengeToken) {
  const url = `${location.origin}/c/${lastChallengeToken}`;
  document.getElementById('link').value = url;
  document.getElementById('linkWrap').style.display = 'block';
  try {
    const alreadyAccepted = await checkAndContinue(lastChallengeToken);
    if (!alreadyAccepted) startContinuePolling(lastChallengeToken);
  } catch {
    localStorage.removeItem('lastChallengeToken');
  }
}
</script></body></html>
